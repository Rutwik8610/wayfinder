# ===================================================================
# WayFinder Backend Configuration Template
# Copy this file or set environment variables before running in production.
# ===================================================================

spring.application.name=tourism-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/tourism_db
spring.datasource.username=postgres
spring.datasource.password=your_database_password_here

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Security & JWT Configuration (Must be a random string of at least 32 UTF-8 bytes)
app.jwt.secret=your_at_least_32_bytes_jwt_secret_key_here
app.jwt.expiration-seconds=3600

# CORS Configuration
app.cors.allowed-origin=http://localhost:3000

# Google Gemini API Key for AI Trip Assistant & Grounded Budgeting
app.gemini.api-key=your_gemini_api_key_here
