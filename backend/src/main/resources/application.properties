spring.application.name=tourism-backend
spring.config.import=optional:classpath:application-local.properties,optional:file:application-local.properties,optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tourism_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Set JWT_SECRET to a random value of at least 32 UTF-8 bytes before starting the backend.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}
app.gemini.api-key=${GEMINI_API_KEY:}